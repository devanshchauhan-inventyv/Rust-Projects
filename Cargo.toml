[workspace]
members = [
    "counter_program"
]
resolver = "2"

# Shared dependencies across all projects
[workspace.dependencies]
borsh = "1.6.0"
solana-instruction = "3.1.0"
solana-program = "3.0.0"
solana-system-interface = "3.0.0"

# Shared dev-dependencies across all projects
litesvm = "0.9.1"
solana-client = "3.1.8"
solana-sdk = "3.0.0"
solana-sdk-ids = "3.1.0"
tokio = "1.49.0"

# Shared profile settings
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Test profile
[profile.test]
opt-level = 1