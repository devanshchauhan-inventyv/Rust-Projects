[workspace]
members = [
    "counter_program/native",
    "counter_program/anchor/programs/*",
    "account-data/native/program",
    "account-data/anchor/programs/*",

]
resolver = "2"

# Shared dependencies across all projects
[workspace.dependencies]
borsh = "1.6.0"
solana-program = "3.0.0"
solana-system-interface = {version="3.0.0",features = ["bincode"] }

anchor-lang = "0.32.1"


# Shared profile settings
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Test profile
[profile.test]
opt-level = 1